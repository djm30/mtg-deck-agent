[project]
name = "mtg-deck-agent"
version = "0.1.0"
description = "Learning project: a Commander deck-builder agent with LangChain, LangGraph and Deep Agents"
readme = "README.md"
authors = [
    { name = "Dylan Morrison", email = "dylanjmorrison30@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.38",
    "httpx>=0.28.1",
    "langchain>=1.5.0",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "langsmith>=0.14.17",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
mtg-deck-agent = "mtg_deck_agent:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.43",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes: unused imports, undefined names
    "I",    # isort: import ordering
    "B",    # bugbear: likely bugs
    "UP",   # pyupgrade: modern Python syntax
    "SIM",  # simplify
    "RUF",  # ruff-specific checks
]

[tool.ruff.lint.isort]
known-first-party = ["mtg_deck_agent"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ty]
